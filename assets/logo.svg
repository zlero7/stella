<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- STELLA 로고: 노트가 판정선에 닿는 순간 터지는 별. 색은 게임 화면과 같다 (하늘빛 파랑 → 레인 패널의 남색, 금빛 별) -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4d94ff"/>
      <stop offset="0.5" stop-color="#2150c8"/>
      <stop offset="1" stop-color="#0b1a52"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="noteC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#cfeeff"/>
    </linearGradient>
    <linearGradient id="trailC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9fd4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailW" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffd36b" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#shine)"/>

    <!-- 레인: 네 줄. 판정선 아래는 더 어둡다 -->
    <g fill="#ffffff" fill-opacity=".07">
      <rect x="196" y="0" width="156" height="1024"/><rect x="352" y="0" width="160" height="1024" fill-opacity=".03"/>
      <rect x="512" y="0" width="160" height="1024" fill-opacity=".03"/><rect x="672" y="0" width="156" height="1024"/>
    </g>
    <g stroke="#ffffff" stroke-opacity=".22" stroke-width="3">
      <line x1="196" y1="0" x2="196" y2="1024"/><line x1="352" y1="0" x2="352" y2="1024"/><line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="672" y1="0" x2="672" y2="1024"/><line x1="828" y1="0" x2="828" y2="1024"/>
    </g>
    <rect x="0" y="540" width="1024" height="484" fill="#06103a" fill-opacity=".38"/>

    <!-- 내려오는 노트 두 개 (비스듬한 평행사변형, 꼬리를 끌고 내려온다) -->
    <rect x="236" y="20" width="100" height="205" fill="url(#trailC)"/>
    <polygon points="258,226 346,226 322,288 234,288" fill="url(#noteC)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <rect x="684" y="150" width="100" height="215" fill="url(#trailW)"/>
    <polygon points="706,366 794,366 770,428 682,428" fill="#ffffff" stroke="#9fc6f3" stroke-width="5" stroke-linejoin="round"/>

    <!-- 판정선 -->
    <rect x="0" y="504" width="1024" height="22" fill="#ffffff" fill-opacity=".9"/>
    <rect x="0" y="496" width="1024" height="38" fill="#bfe6ff" fill-opacity=".28"/>

    <!-- 터지는 별: 판정선 한가운데 -->
    <circle cx="512" cy="515" r="250" fill="url(#core)" filter="url(#glow)"/>
    <path d="M512 150 Q512 515 878 515 Q512 515 512 880 Q512 515 146 515 Q512 515 512 150 Z" fill="#9fd4ff" filter="url(#glow)" opacity=".85"/>
    <path d="M512 150 Q512 515 878 515 Q512 515 512 880 Q512 515 146 515 Q512 515 512 150 Z" fill="url(#star)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="512" cy="515" r="44" fill="#fff6d6"/>

    <!-- 작은 별 -->
    <path d="M826 196 Q826 246 876 246 Q826 246 826 296 Q826 246 776 246 Q826 246 826 196 Z" fill="#ffe9a8"/>
    <path d="M214 770 Q214 806 250 806 Q214 806 214 842 Q214 806 178 806 Q214 806 214 770 Z" fill="#ffffff" fill-opacity=".92"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="6"/>
</svg>
